<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>代理对账 V2 · 交互设计</title>
<style>
:root{--bg:#f3f5f3;--ink:#1b302b;--muted:#687b73;--line:#dce5de;--green:#17694e;--gold:#a47520;--red:#a33b33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 15px}button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:white;border-color:var(--green)}.danger{color:var(--red)}header{background:#173f33;color:#fff;padding:26px max(24px,calc((100vw - 1180px)/2))}header p{color:#b8d1c5;margin:5px 0}.brand{font-size:12px;letter-spacing:3px;color:#c3d5b2}h1{font-size:28px;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}nav button{background:transparent;color:#c4d9ce;border-color:#45695a}nav button.active{background:#e8f0e3;color:#173f33}main{max-width:1228px;padding:26px 24px 80px;margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.caption{font-size:12px;letter-spacing:2px;color:var(--muted)}h2{font-size:22px;margin:0 0 4px}h3{font-size:17px;margin:0 0 12px}p{margin:7px 0}.muted{color:var(--muted);font-size:13px}.notice{padding:12px 17px;border:1px solid #d8e1cb;background:#edf2e5;border-radius:10px;margin:15px 0}.alert{background:#fff1eb;border-color:#e9b9a5;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.card span{font-size:13px;color:var(--muted)}.card strong{display:block;font-size:26px;letter-spacing:-.5px;margin-top:8px;font-variant-numeric:tabular-nums}.card.net{background:#e4eee7;border-color:#bad1c0}.formula{border-left:3px solid var(--green);padding:8px 14px;background:#f7faf7;margin:14px 0}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:18px}.panel{margin-bottom:18px}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#edf2e9;color:#3b6652;font-size:12px}.rows{display:grid;gap:10px}.row{border:1px solid var(--line);border-radius:10px;padding:13px 15px}.row summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.row p{font-size:13px;color:var(--muted)}.amount{font-weight:700;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stats b{display:block;font-size:21px}.stats span{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;margin:10px 0}input,select{width:100%;border:1px solid #c8d6cd;background:#fff;border-radius:7px;padding:9px;color:var(--ink)}.filter{max-width:230px}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:10px 0 10px 15px;border-left:2px solid #bed1c2;font-size:13px}.timeline small{display:block;color:var(--muted)}.toolbar{padding:15px;background:#eaf0ec;border-radius:12px;margin:18px 0}.view[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:16px;padding:25px;max-width:460px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#102b2288}dialog .actions{justify-content:flex-end;margin-top:20px}#message{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#193c30;color:white;border-radius:10px;padding:12px 20px;box-shadow:0 8px 25px #0002;max-width:90%;z-index:5}footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}.footlink{color:var(--green)}@media(max-width:760px){header{padding:22px 18px}main{padding:20px 16px 100px}h1{font-size:24px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:15px}.card strong{font-size:22px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.paybar{position:sticky;bottom:8px;background:#fff;padding:12px;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 18px #173f3322}.bar{align-items:flex-start}.actions button{flex-grow:1}}
</style>
</head>
<body>
<header><div class="brand">KAIMI / FINANCE WORKSPACE</div><h1>让每一笔结算，都有来处。</h1><p>代理对账 V2 · 累计余额 / 固定快照 / 人民币付款登记</p><nav aria-label="视图切换"><button data-view="admin" class="active">管理员对账台</button><button data-view="agent">代理账本 · 只读</button><button data-view="detail">批次详情</button></nav></header>
<main>
<div class="bar"><span class="pill">独立静态原型 · 不接真实接口 · 不自动打款</span><button id="reset">重置演示</button></div>
<section id="admin" class="view"></section><section id="agent" class="view" hidden></section><section id="detail" class="view" hidden></section>
<footer>所有金额为人民币；时间为北京时间。刷新页面不保留演示记录。 <a class="footlink" href="../agent-settlement-v2-design.md">开发契约与编号验收</a></footer>
</main>
<dialog id="confirm"><h2>付款登记 · 二次确认</h2><div id="confirmText"></div><p class="muted">仅登记线下凭证，不发起转账。完成后原快照不可改，后续差额需关联更正。</p><div class="actions"><button id="back">返回核对</button><button id="commit" class="primary">确认登记</button></div></dialog>
<div id="message" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const money = c => '¥' + (c / 100).toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp = () => new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const baseline = () => [
{id:'E-1001',type:'earning',no:'SO-1001',name:'Plus · 已支付 / 已发齐',amount:28000,pre:105000,coupon:5000,gross:100000,cost:70000,fee:2000,platform:1000,date:'2026-10-08',version:1},
{id:'E-1002',type:'earning',no:'SO-1002',name:'Pro · 已支付 / 已发齐',amount:56000,pre:200000,coupon:0,gross:200000,cost:140000,fee:4000,platform:2000,date:'2026-10-09',version:1},
{id:'AD-001',type:'adjustment',no:'AD-001',name:'手续费更正 #1',amount:-4000,date:'2026-10-09',version:1,origin:'RC-OLD-001 / E-0901 / SO-0901'},
{id:'DR-001',type:'draw_item',no:'DR-001',name:'提卡 · 10 张',amount:30000,date:'2026-10-08',version:1}
];
let rows, batches, audit, view='admin', selected, seq, extra, scenario, period='all', pendingPayment;
const statusName = {pending_payment:'待确认 / 待付款',paid:'已登记付款',cleared:'抵扣结清',cancelled:'已取消',corrected:'已更正'};
function totals(items){const t={store:0,adjust:0,draw:0};items.forEach(r=>t[r.type==='earning'?'store':r.type==='adjustment'?'adjust':'draw']+=r.amount);t.net=t.store+t.adjust-t.draw;return t;}
function direction(n){return n>0?'平台应付代理':n<0?'代理应付平台':'零净额 · 抵扣结清';}
function active(){return batches.find(b=>b.status==='pending_payment');}
function available(){return rows.filter(r=>!r.settled&&!r.claim);}
function unpaid(){return rows.filter(r=>!r.settled);}
function changed(b){return b.items.some(i=>{const r=rows.find(x=>x.id===i.id);return !r||r.version!==i.version||r.claim!==b.id||r.settled;});}
function note(s){$('message').textContent=s;$('message').hidden=false;clearTimeout(note.timer);note.timer=setTimeout(()=>$('message').hidden=true,4500);}
function log(action,detail){audit.unshift({time:stamp(),action,detail});}
function reset(){rows=baseline();batches=[];audit=[];selected=null;seq=0;extra=0;scenario='normal';period='all';pendingPayment=null;log('初始化演示','累计可对账净额 500.00 元；不含 3 条待核对订单');if($('confirm').open)$('confirm').close();render();}
function cards(t){return `<div class="cards"><div class="card"><span>商店收益未结</span><strong>${money(t.store)}</strong></div><div class="card"><span>有符号调整</span><strong>${money(t.adjust)}</strong></div><div class="card"><span>提卡未结欠款</span><strong>${money(t.draw)}</strong></div><div class="card net"><span>${direction(t.net)}</span><strong>${money(Math.abs(t.net))}</strong></div></div>`;}
function formula(t){return `<div class="formula">${money(t.store)} + (${money(t.adjust)}) − ${money(t.draw)} = <b>${money(t.net)}</b><br><span class="muted">商店收益 + 调整 − 提卡欠款 · 正数平台付，负数代理付</span></div>`;}
function itemHTML(items){return items.length?items.map(r=>`<details class="row"><summary><span><b>${esc(r.no)}</b> · ${esc(r.name)}</span><span class="amount">${r.type==='draw_item'?'欠款 ':''}${money(r.amount)}</span></summary><p>来源 ID ${esc(r.id)} · ${esc(r.date)} · 源版本 ${r.version}</p>${r.type==='earning'?`<p>券前 ${money(r.pre)} − 优惠 ${money(r.coupon)} = 券后 ${money(r.gross)}<br>券后 ${money(r.gross)} − 代理成本 ${money(r.cost)} − 代理手续费 ${money(r.fee)} = 收益 ${money(r.amount)}<br>通道费 ${money(r.fee+r.platform)} = 代理 ${money(r.fee)} + 平台 ${money(r.platform)}；开票加价 0（不计代理收益）</p>`:r.type==='adjustment'?`<p>原因：${esc(r.name)} · 原批次 / 收益行 / 订单：${esc(r.origin)}</p>`:'<p>提卡金额按固定成本快照纳入；父批次关联锁定明细。</p>'}</details>`).join(''):'<div class="notice">暂无可纳入明细。查看历史或等待新增账务。</div>';}
function history(){return `<div class="panel"><h3>结算历史 <span class="pill">${batches.length} 个演示批次</span></h3><div class="rows">${batches.length?batches.slice().reverse().map(b=>`<div class="row bar"><div><b>${b.id}</b> <span class="pill">${statusName[b.status]}</span><p class="muted">${direction(b.t.net)} · ${money(Math.abs(b.t.net))} · ${b.items.length} 条</p></div><button data-open="${b.id}">展开快照</button></div>`).join(''):'<p class="muted">本次演示尚无批次。生成快照后，历史始终保留。</p>'}</div></div>`;}
function timeline(){return `<div class="panel"><h3>审计时间线 · 演示管理员</h3><ul class="timeline">${audit.map(a=>`<li><b>${esc(a.action)}</b> · ${esc(a.detail)}<small>${esc(a.time)} 北京时间 · 静态演示 actor=admin / IP=local</small></li>`).join('')}</ul></div>`;}
function top(){const t=totals(unpaid());return `<div class="bar" style="margin-top:20px"><div><div class="caption">NORTH STAR / AGENT 017</div><h2>北辰商店 · 累计未结</h2><p class="muted">截至 ${esc(stamp())}（北京时间）· 包含已锁定但未付款明细</p></div><span class="pill">${active()?'有待付款批次':unpaid().length?'尚有未结明细':'可对账明细已结清'}</span></div>${cards(t)}<p class="muted">上述为可对账口径，不含 3 条待核对订单；完整账务金额未核定，不按零计算。期间筛选不会改变累计。</p>`;}
function renderAdmin(){const a=active(),items=available(),t=totals(items);$('admin').innerHTML=top()+`<div class="toolbar"><div class="bar"><div><b>演示控制器</b><p class="muted">正常 +500 / 零净额 / 仅提卡 −300。切场景会重置账本及历史。</p></div><div class="actions"><button data-action="normal">正常示例</button><button data-action="zero">零净额示例</button><button data-action="negative">仅提卡示例</button><button data-action="new">模拟新增账 +100</button></div></div></div><div class="grid"><div><div class="panel"><div class="bar"><h3>本次可纳入 · 未占用明细 ${items.length} 条</h3><button data-action="export-ledger">导出累计明细</button></div>${formula(t)}<div class="rows">${itemHTML(items)}</div><div class="actions" style="margin-top:16px"><button class="primary" data-action="generate" ${a||!items.length?'disabled':''}>生成本次固定快照</button>${a?`<button data-open="${a.id}">查看待付款 ${a.id}</button>`:''}</div><p class="muted">生成与核对在原型合并为待付款；仅锁定明细，不清零余额。</p></div>${history()}</div><aside><div class="panel"><h3>核对与跳过项</h3><p><span class="pill">3 条待核对</span> 不自动纳入批次</p><div class="row"><b>SO-X1 · manual_review</b><p>核对渠道最终手续费凭证，再重新计算。</p></div><div class="row"><b>SO-X2 · 账本恒等式不一致</b><p>核对订单与收益行成本、券后额。</p></div><div class="row"><b>SO-X3 · 数据缺失</b><p>补齐来源记录，不猜测金额。</p></div></div>${timeline()}</aside></div>`;}
function renderAgent(){const orders=rows.filter(r=>r.type==='earning'&&(period==='all'||r.date==='2026-10-09'));const sum=k=>orders.reduce((s,r)=>s+r[k],0);$('agent').innerHTML=top()+`<div class="notice">代理只读：可查看自己的快照与导出，不可取消、修改金额或登记付款。</div><div class="panel"><div class="bar"><div><h3>期间经营统计 · 独立筛选</h3><p class="muted">只影响本区统计与成交明细，不影响上方累计未结及历史快照。</p></div><label class="filter">经营期间<select id="period"><option value="all" ${period==='all'?'selected':''}>2026-10-01 至 10-11（不含）</option><option value="day" ${period==='day'?'selected':''}>2026-10-09 单日</option></select></label></div><div class="stats">${[['券后成交额',money(sum('gross'))],['已付 / 已发齐订单',orders.length+' / '+orders.length],['发卡量',orders.length+' 张'],['未兑换量','1 张'],['券减免',money(sum('coupon'))],['通道手续费',money(sum('fee')+sum('platform'))],['代理承担手续费',money(sum('fee'))],['代理收益',money(sum('amount'))]].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div></div><div class="panel"><div class="bar"><h3>成交明细 · 展开复算</h3><button data-action="export-period">导出期间明细</button></div><div class="rows">${itemHTML(orders)}</div></div>${history()}<p class="muted">异议处理：展开批次复制编号并联系管理员；一期不提供工单系统。</p>`;}
function renderDetail(){const b=batches.find(x=>x.id===selected)||batches[batches.length-1];if(!b){$('detail').innerHTML='<div class="panel" style="margin-top:20px"><h2>还没有快照</h2><p>请先在管理员台生成快照。代理不能创建批次。</p></div>';return;}selected=b.id;const stale=b.status==='pending_payment'&&changed(b),readonly=view==='agent'||b.viewer==='agent';const can=b.status==='pending_payment'&&!readonly;
$('detail').innerHTML=`<div class="bar" style="margin-top:20px"><div><div class="caption">IMMUTABLE RECONCILIATION</div><h2>${b.id}</h2><p class="muted">北辰商店 · 创建人：演示管理员 · ${statusName[b.status]}</p></div><div class="actions"><button data-action="copy">复制批次号</button><button data-action="export-batch">导出快照 CSV</button></div></div><div class="notice">固定快照 · 生成 ${esc(b.created)} · cutoff ${esc(b.cutoff)} 北京时间 · ${b.items.length} 条 · hash ${b.hash}<br>新订单、新提卡、新调整不会进入本批次。当前源数据不用于重写历史金额。</div>${stale?'<div class="notice alert">SNAPSHOT_CHANGED：已纳入的源明细发生变化。旧快照金额未修改，付款已阻断。取消后刷新预览并重新生成。</div>':''}${cards(b.t)}${formula(b.t)}<div class="grid"><div><div class="panel"><h3>不可变明细快照</h3><div class="rows">${itemHTML(b.items)}</div></div>${history()}${timeline()}</div><aside><div class="panel"><h3>${readonly?'代理只读快照':'人民币付款登记'}</h3>${b.payment?`<p>方向：${direction(b.t.net)}</p><p>人民币 ${money(Math.abs(b.t.net))}</p><p>方式：${esc(b.payment.method)}</p><p>流水：${esc(b.payment.reference)}</p><p>实际付款时间：${esc(b.payment.time)}</p><p>备注：${esc(b.payment.note||'无')}</p>`:b.status==='cleared'?'<p>抵扣结清，无付款方式及流水。</p>':b.status==='cancelled'?'<p>未付款已取消，明细已释放；历史快照仍保留。</p>':readonly?'<p>仅管理员可登记线下付款或取消。复制批次号联系管理员提出异议。</p>':`<p><b>${direction(b.t.net)} ${money(Math.abs(b.t.net))}</b></p>${b.t.net!==0?'<label>人民币付款方式<select id="method"><option>支付宝</option><option>微信</option><option>银行卡</option><option>其他</option></select></label><label>流水号（必填）<input id="reference" maxlength="120" placeholder="输入已核验线下流水"></label><label>实际付款时间（北京时间）<input id="paytime" type="datetime-local" value="2026-10-10T17:00"></label><label>备注（选填）<input id="paynote" maxlength="200" placeholder="凭证核验说明"></label>':'<p class="notice">净额为零，只确认抵扣，不记录付款方式和流水。</p>'}<div class="paybar actions"><button data-action="pay" class="primary" ${!can||stale?'disabled':''}>${b.t.net>0?'登记平台已付':b.t.net<0?'登记代理已付':'确认抵扣结清'}</button><button data-action="cancel" class="danger" ${!can?'disabled':''}>取消批次</button></div>`}</div>${!readonly&&b.status==='pending_payment'?'<div class="panel"><h3>并发与源变更演示</h3><div class="actions"><button data-action="new">新增账 +100</button><button data-action="change">模拟已纳入源变更</button></div><p class="muted">新增行仅改变累计；变更已纳入行版本会阻断旧批次登记。取消重建可恢复。</p></div>':''}${!readonly&&(b.status==='paid'||b.status==='cleared')?'<div class="panel"><h3>已完成不可改</h3><button data-action="correction">生成关联费用更正 −20</button><p class="muted">原快照与凭证不变，新调整进入下一批次；同单可多次有序修正。</p></div>':''}</aside></div>`;}
function render(){renderAdmin();renderAgent();renderDetail();document.querySelectorAll('.view').forEach(el=>el.hidden=el.id!==view);document.querySelectorAll('nav button').forEach(el=>el.classList.toggle('active',el.dataset.view===view));}
function switchView(v){view=v;if(v==='detail'){const b=batches.find(x=>x.id===selected);if(b)b.viewer='admin';}render();}
function generate(){if(active()){note('已有待付款批次，请先完成或取消。');return;}const list=available();if(!list.length){note('EMPTY_BATCH：暂无可纳入明细。');return;}const id='RC-20261010-'+String(++seq).padStart(3,'0');const items=JSON.parse(JSON.stringify(list));const b={id,items,t:totals(items),status:'pending_payment',created:stamp(),cutoff:stamp(),hash:'demo-'+seq+'-'+items.map(r=>r.id+':'+r.version).join('|'),viewer:'admin'};list.forEach(r=>r.claim=id);batches.push(b);selected=id;log('生成 / 确认快照',id+' · '+direction(b.t.net)+' '+money(Math.abs(b.t.net)));view='detail';render();note('快照已锁定；累计未结不因生成清零。');}
function add(){const n=++extra;rows.push({id:'E-NEW-'+n,type:'earning',no:'SO-100'+(n+2),name:'新增商品 · 已支付 / 已发齐',amount:10000,pre:50000,coupon:0,gross:50000,cost:38000,fee:2000,platform:500,date:'2026-10-10',version:1});log('模拟新增账',`收益 +100.00；所有已生成快照不变`);render();note('累计增加 ¥100.00，旧快照保持原金额。');}
function cancel(){const b=batches.find(x=>x.id===selected);if(!b||b.status!=='pending_payment'||b.viewer==='agent'){note('BATCH_NOT_CANCELLABLE');return;}b.status='cancelled';rows.filter(r=>r.claim===b.id).forEach(r=>delete r.claim);log('取消批次',b.id+' · 全部活跃占用已释放');render();}
function pay(){const b=batches.find(x=>x.id===selected);if(!b||b.status!=='pending_payment'||b.viewer==='agent')return;if(changed(b)){note('SNAPSHOT_CHANGED：请取消并重新生成。');return;}let p=null;if(b.t.net!==0){const reference=$('reference').value.trim(),time=$('paytime').value;if(!reference){note('PAYMENT_REFERENCE_REQUIRED：请填写流水号。');$('reference').focus();return;}if(!time){note('请填写实际付款时间。');return;}p={method:$('method').value,reference,time,note:$('paynote').value.trim()};}pendingPayment={id:b.id,payment:p};$('confirmText').innerHTML=`<div class="notice"><b>${direction(b.t.net)} ${money(Math.abs(b.t.net))}</b><br>批次 ${b.id} · ${b.items.length} 条<br>${p?esc(p.method)+' / '+esc(p.reference):'零净额，不产生付款凭证'}</div>`;$('confirm').showModal();}
function commit(){const q=pendingPayment,b=q&&batches.find(x=>x.id===q.id);if(!b||b.status!=='pending_payment'||changed(b)||b.viewer==='agent'){note('状态或源已变化，拒绝登记。');$('confirm').close();return;}b.status=b.t.net===0?'cleared':'paid';b.payment=q.payment;rows.filter(r=>r.claim===b.id).forEach(r=>r.settled=true);log(b.status==='paid'?'登记人民币付款':'抵扣结清',b.id+' · '+direction(b.t.net)+' '+money(Math.abs(b.t.net)));pendingPayment=null;$('confirm').close();render();note('只结清快照中的明细；新增账务继续保留在累计未结。');}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function download(items,name,b){const data=[['批次号','快照hash','来源ID','类型','订单号','时间','券前分','优惠分','券后分','成本分','代理手续费分','平台手续费分','金额分','原批次/原因'],...items.map(r=>[b?b.id:name,b?b.hash:'实时演示',r.id,r.type,r.no,r.date,r.pre,r.coupon,r.gross,r.cost,r.fee,r.platform,r.amount,r.origin||r.name])];const blob=new Blob(['\ufeff'+data.map(line=>line.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);note('已导出 '+name+'，金额单位分；负值以文本防公式注入。');}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.view){switchView(el.dataset.view);return;}if(el.dataset.open){selected=el.dataset.open;const b=batches.find(x=>x.id===selected);b.viewer=view==='agent'?'agent':view==='detail'?b.viewer:'admin';view='detail';render();return;}const action=el.dataset.action;if(!action)return;const b=batches.find(x=>x.id===selected);if(['generate','new','change','cancel','pay','correction'].includes(action)&&(view==='agent'||(view==='detail'&&b&&b.viewer==='agent'))){note('代理仅可读取自己的快照。');return;}if(['normal','zero','negative'].includes(action)){reset();scenario=action;if(action==='zero')rows.find(r=>r.type==='draw_item').amount=80000;if(action==='negative')rows=rows.filter(r=>r.type==='draw_item');log('切换演示场景',action==='zero'?'零净额：840 − 40 − 800 = 0':action==='negative'?'仅提卡：代理应付平台300':'正常净额500');view='admin';render();}else if(action==='generate')generate();else if(action==='new')add();else if(action==='change'){if(!b||b.status!=='pending_payment')return;const r=rows.find(x=>x.id===b.items[0].id);r.version++;log('模拟源变更',r.id+' 版本更新，旧批次金额不变，确认阻断');render();}else if(action==='cancel')cancel();else if(action==='pay')pay();else if(action==='export-batch'&&b)download(b.items,b.id,b);else if(action==='export-ledger')download(unpaid(),'累计未结');else if(action==='export-period')download(rows.filter(r=>r.type==='earning'&&(period==='all'||r.date==='2026-10-09')),'期间成交');else if(action==='copy'&&b){try{await navigator.clipboard.writeText(b.id);note('已复制 '+b.id);}catch{note('批次号：'+b.id+'（本地环境可手动复制）');}}else if(action==='correction'&&b&&(b.status==='paid'||b.status==='cleared')){const n=rows.filter(r=>r.origin&&r.origin.startsWith(b.id)).length+1;rows.push({id:'COR-'+b.id+'-'+n,type:'adjustment',no:'COR-'+seq+'-'+n,name:'费用差额更正 #'+n,amount:-2000,date:'2026-10-10',version:1,origin:b.id+' / '+b.items[0].id+' / '+b.items[0].no});log('创建关联更正',b.id+' #'+n+'，新增调整 −20.00，原快照不变');render();note('新调整已进入累计未结，原批次不修改。');}});
document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;renderAgent();}});
$('reset').addEventListener('click',()=>{view='admin';reset();note('已重置为正常示例。');});$('back').addEventListener('click',()=>{$('confirm').close();pendingPayment=null;});$('commit').addEventListener('click',commit);$('confirm').addEventListener('cancel',()=>pendingPayment=null);reset();
</script>
</body>
</html>
