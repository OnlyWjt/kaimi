services:
  kaimi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      KAIMI_DATABASE_URL: file:/app/apps/web/data/kaimi.db
    volumes:
      - kaimi_data:/app/apps/web/data
    # 默认只绑在 docker 网桥地址上：宿主机和其他容器（1Panel 的 OpenResty、现成的 nginx）
    # 连得进来，公网连不进来。绝对不要绑 0.0.0.0 —— 直连应用端口的请求可以随便伪造
    # X-Forwarded-For，按 IP 的限流就形同虚设。网桥地址不是 172.17.0.1 时改 KAIMI_BIND_ADDR。
    ports:
      - "${KAIMI_BIND_ADDR:-172.17.0.1}:3100:3100"

  # 宿主机 80/443 已经被别的网关占着时不要启用它，否则它会起不来把整次部署带失败。
  # 需要它当入口：docker compose -f deploy/docker-compose.yml --profile caddy up -d --build
  caddy:
    profiles:
      - caddy
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaimi

volumes:
  kaimi_data:
  caddy_data:
  caddy_config:
