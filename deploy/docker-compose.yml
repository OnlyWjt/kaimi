services:
  kaimi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      KAIMI_DATABASE_URL: file:/app/apps/web/data/kaimi.db
    volumes:
      - kaimi_data:/app/apps/web/data
    # 不对外映射 3100：只让 caddy 进得来。直连应用端口的请求可以随便伪造
    # X-Forwarded-For，按 IP 的限流就形同虚设。
    expose:
      - "3100"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaimi

volumes:
  kaimi_data:
  caddy_data:
  caddy_config:
