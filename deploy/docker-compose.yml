services:
  kaimi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      KAIMI_DATABASE_URL: file:/app/apps/web/data/kaimi.db
    volumes:
      - kaimi_data:/app/apps/web/data
    # 默认绑这台生产机的 docker 网桥 172.26.0.1：1Panel OpenResty 反代填
    # http://172.26.0.1:3100，公网连不进来。换机器或网桥段变了，在 .env 里改
    # KAIMI_BIND_ADDR，或用 ./deploy/up.sh 启动（它会现算网桥地址覆盖这里）。
    # 别改成 0.0.0.0：直连应用端口可以随便伪造 X-Forwarded-For，按 IP 的限流就废了。
    ports:
      - "${KAIMI_BIND_ADDR:-172.26.0.1}:3100:3100"

  # 宿主机 80/443 已经被别的网关占着时不要启用它，否则它会起不来把整次部署带失败。
  # 需要它当入口：docker compose -f deploy/docker-compose.yml --profile caddy up -d --build
  caddy:
    profiles:
      - caddy
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kaimi

volumes:
  kaimi_data:
  caddy_data:
  caddy_config:
